<div>{{ detail?.title }} {{ detail?.number }}</div>

<div>
  {{ detail?.state }}
</div>

<div class="align-detail">
  <div class="body-text">
    <p>{{ detail?.body }}</p>
  </div>

  <div>
    Labels

    @for (d of detail?.labels; track d; let index = $index) {
      <div>
        <label
        [ngStyle]="{
          color: '#' + d.color
        }"
          >{{ d.name }}</label
          >
        </div>
      }
    </div>
  </div>
